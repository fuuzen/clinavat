# Existing deployments only: preserves the original project, external volumes and absolute paths.
# Run from the repository root with --env-file .env; keep the original CC_POOL_* settings.
name: cc-pool
services:
  hub:
    build:
      context: ..
      target: hub
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.308}
        CODEX_VERSION: ${CODEX_VERSION:-0.164.0}
        MUTAGEN_VERSION: ${MUTAGEN_VERSION:-0.18.1}
    init: true
    restart: unless-stopped
    environment:
      CLINAVAT_DATA_DIR: /srv/pool
      CC_POOL_MASTER_KEY: ${CC_POOL_MASTER_KEY:?请保留原 CC_POOL_MASTER_KEY}
      CC_POOL_ORIGIN: ${CC_POOL_PUBLIC_ORIGIN:-}
      CC_POOL_WEB_PORT: ${CC_POOL_WEB_PORT:-8080}
      CC_POOL_COOKIE_SECURE: ${CC_POOL_COOKIE_SECURE:-false}
      CC_POOL_REGISTRATION: ${CC_POOL_REGISTRATION:-false}
      CC_POOL_APPROVAL_TIMEOUT_MS: ${CC_POOL_APPROVAL_TIMEOUT_MS:-300000}
      CLINAVAT_WORKSPACE_DIR: /var/tmp/cc-pool-workspace
    volumes:
      - pool-data:/srv/pool
      - pool-workspaces:/var/tmp/cc-pool-workspace
    tmpfs:
      - /srv/pool/run:mode=1777,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    ports:
      - "${CC_POOL_WEB_BIND:-127.0.0.1}:${CC_POOL_WEB_PORT:-8080}:80"
    depends_on:
      hub:
        condition: service_healthy
volumes:
  pool-data:
    external: true
    name: ${CLINAVAT_LEGACY_DATA_VOLUME:-cc-pool_pool-data}
  pool-workspaces:
    external: true
    name: ${CLINAVAT_LEGACY_WORKSPACE_VOLUME:-cc-pool_pool-workspaces}
