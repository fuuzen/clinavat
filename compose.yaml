name: clinavat
services:
  hub:
    build:
      context: .
      target: hub
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.308}
        CODEX_VERSION: ${CODEX_VERSION:-0.164.0}
        MUTAGEN_VERSION: ${MUTAGEN_VERSION:-0.18.1}
    init: true
    restart: unless-stopped
    environment:
      CLINAVAT_MASTER_KEY: ${CLINAVAT_MASTER_KEY:?请配置 CLINAVAT_MASTER_KEY；已有部署请使用 deploy/compose.legacy.yaml}
      CLINAVAT_ORIGIN: ${CLINAVAT_PUBLIC_ORIGIN:-}
      CLINAVAT_WEB_PORT: ${CLINAVAT_WEB_PORT:-8080}
      CLINAVAT_COOKIE_SECURE: ${CLINAVAT_COOKIE_SECURE:-false}
      CLINAVAT_REGISTRATION: ${CLINAVAT_REGISTRATION:-false}
      CLINAVAT_APPROVAL_TIMEOUT_MS: ${CLINAVAT_APPROVAL_TIMEOUT_MS:-300000}
      CLINAVAT_WORKSPACE_DIR: /var/tmp/clinavat-workspace
    volumes:
      - data:/srv/clinavat
      - workspaces:/var/tmp/clinavat-workspace
    tmpfs:
      - /srv/clinavat/run:mode=1777,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${CLINAVAT_WEB_BIND:-127.0.0.1}:${CLINAVAT_WEB_PORT:-8080}:80"
    depends_on:
      hub:
        condition: service_healthy
volumes:
  data:
    name: ${CLINAVAT_DATA_VOLUME:?新部署请配置 CLINAVAT_DATA_VOLUME；旧部署请使用 deploy/compose.legacy.yaml}
  workspaces:
    name: ${CLINAVAT_WORKSPACE_VOLUME:?新部署请配置 CLINAVAT_WORKSPACE_VOLUME；旧部署请使用 deploy/compose.legacy.yaml}
