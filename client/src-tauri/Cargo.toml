[package]
name = "clinavat-client"
version = "0.1.0"
description = "Clinavat desktop and mobile client"
edition = "2021"
publish = false

[lib]
# The suffix keeps the library name distinct from the binary on Windows.
name = "clinavat_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
